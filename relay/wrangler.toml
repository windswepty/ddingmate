name = "ddingmate-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# 문의가 올라갈 디스코드 채널 ID (개발자 모드 켜고 채널 우클릭 → ID 복사)
CHANNEL_ID = "1560930202089955338"
# 멘션·답변할 개발자 디스코드 사용자 ID
DEV_USER_ID = "726781498606354452"
# 띵메이트가 답을 기다리는 문의(보낸 지 하루 안)를 몇 초마다 확인할지(60~1800). 요청이 많아지면 늘린다
POLL_SEC = "120"
# 띵메이트가 개발자 공지를 다시 물을 간격(분, 10~180). 사용자가 많아져 요청이 무료 한도에 가까우면 늘린다
NOTICE_POLL_MIN = "30"
# /admin/commands(디스코드에 /공지 등록)를 부를 열쇠의 SHA-256. 열쇠는 relay/.admin-key(저장소에 안 올림)
ADMIN_KEY_HASH = "c19784f9b74424b0d45ccbcb19997528da55b60c9f8604bef1e1e52007a9491d"

# 디스코드 앱 공개 키(General Information → PUBLIC KEY). 비밀 값 아님: 디스코드가 보낸 요청인지 서명을 확인하는 데만 쓴다
DISCORD_PUBLIC_KEY = "f1d6305d8afacd52eee538d7862a3d71bc7f2e4581a77860d6cb54732fd79fd6"

# 봇 토큰은 여기 적지 말고 비밀 값으로(터미널에 직접 붙여 넣기):
#   npx wrangler secret put DISCORD_TOKEN

# 문의·답변 저장(쓰자마자 정확히 읽히는 D1). 표는 migrations/
[[d1_databases]]
binding = "DB"
database_name = "ddingmate-relay"
database_id = "dc5228ea-1ea1-400b-a6f4-85c5b9068af0"
migrations_dir = "migrations"

# 하루 한 번(한국 시간 새벽 4시) 90일 지난 기록 지우기
[triggers]
crons = ["0 19 * * *"]

# 대시보드에서 오류 기록을 볼 수 있게
[observability]
enabled = true

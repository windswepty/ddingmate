plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Mod Menu 설정 버튼 연동(컴파일용). 실제 실행에는 Mod Menu 가 있어도 되고 없어도 된다.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// 개발·테스트 실행 때만 Mod Menu 를 함께 띄운다(배포 jar 에는 포함되지 않음).
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// 자동 클라이언트 테스트: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "ddingmate-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// 빠른 시험(기본): 실제 기록 재생·전시용 화면·스크린샷을 건너뛴다(평소 고칠 때).
// 전체 시험: ./gradlew runClientGameTest -Pfull (출시·커밋 전)
tasks.named('runClientGameTest') {
	if (project.hasProperty('full')) jvmArgs('-Dddingmate.full=true')
}

// 마인크래프트를 띄우지 않는 단위 시험(정규식·시간 계산): ./gradlew test — 몇 초
dependencies {
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// 마인크래프트 클래스(Text·Formatting 등)를 그대로 쓴다(게임을 띄우지는 않음)
	classpath += sourceSets.main.runtimeClasspath
	// 한글 경로("바탕 화면/띵타이쿤"): 시험 실행 JVM 이 경로 목록 파일을 MS949 로 읽어 프로젝트 폴더를 못 찾는다(ClassNotFoundException).
	// 실행 직전에 프로젝트 안 폴더(클래스·리소스)와 jar(마인크래프트)를 영어 경로(임시 폴더)로 복사해 쓴다
	doFirst {
		def root = new File(System.getProperty('java.io.tmpdir'), 'ddingmate-unit-test')
		def moved = [:]
		classpath.files.findAll { it.exists() && it.path.startsWith(projectDir.path) }.eachWithIndex { src, i ->
			if (src.isDirectory()) {
				def to = new File(root, "cp${i}")
				project.delete(to)
				project.copy { from src; into to }
				moved[src] = to
			} else {
				// 마인크래프트 jar 도 프로젝트 안(.gradle/loom-cache)에 있다: 바뀌었을 때만 다시 복사
				def to = new File(root, "jar/${src.name}")
				if (!to.exists() || to.length() != src.length() || to.lastModified() < src.lastModified()) {
					project.copy { from src; into to.parentFile }
				}
				moved[src] = to
			}
		}
		classpath = files(classpath.files.collect { moved.containsKey(it) ? moved[it] : it })
		testClassesDirs = files(testClassesDirs.files.collect { moved.containsKey(it) ? moved[it] : it })
	}
}

// 배포용 jar 그대로 실제(production) 환경에서 띄워 보기: ./gradlew prodClient
configurations {
	prodMods {
		transitive = false
	}
}

dependencies {
	prodMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	prodMods "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from(remapJar.archiveFile)
	mods.from(configurations.prodMods)
	runDir = layout.buildDirectory.dir("run/prod")
	programArgs.addAll("--quickPlaySingleplayer", "New World")
	dependsOn remapJar
}
